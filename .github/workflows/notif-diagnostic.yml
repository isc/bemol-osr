name: Diagnostic notifications

# Répond à deux questions qu'on ne peut pas trancher depuis l'extérieur du
# worker (cf. issue #148 et la revue de la chaîne push) :
#   1. les trois secrets VAPID sont-ils bien posés sur le worker ? Sans
#      VAPID_PRIVATE_KEY ou VAPID_SUBJECT, sendPush() lève, l'erreur est
#      avalée par son catch, et le musicien voit « Activées » sans jamais
#      rien recevoir — panne totalement silencieuse ;
#   2. les envois aboutissent-ils ? Le worker agrège le résultat de chaque
#      cycle dans le KV (push-stats:last / push-stats:totals, cf.
#      recordPushStats) : sans ça, un push refusé par Apple ou Google est
#      invisible — l'abonné voit « Activées » et ne reçoit rien ;
#   3. combien d'appareils sont réellement abonnés au push ? Un profil KV
#      n'est pas un abonné : l'app en crée un dès qu'on touche aux Réglages,
#      avec subscription: null (abonnement ICS personnalisé seul) ;
#   4. les retours du formulaire « Donner un avis » partent-ils bien par
#      email (feedback-mail:last / feedback-mail:totals, cf.
#      recordFeedbackMail) ? Même risque de panne silencieuse.
#   5. le worker lance-t-il bien les crons de données à l'heure
#      (dispatch-stats:last / dispatch-stats:totals, cf. dispatchWorkflows) ?
#      Un jeton expiré ferait retomber en silence sur les seuls `schedule` de
#      GitHub, qui ne sont pas tenus (revue #203).
#
# Lancement manuel uniquement (Actions → ce workflow → Run workflow), pour ne
# pas relire le KV à chaque push.
#
# Confidentialité : ce workflow ne publie que des COMPTES et des NOMS de
# secrets. Jamais le contenu d'un profil — un objet subscription contient
# l'endpoint push de l'appareil et ses clés, et les journaux d'Actions sont
# publics sur ce dépôt. Ne pas ajouter de `kv key get` qui afficherait un
# profil entier.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances du worker
        run: npm install

      - name: Secrets VAPID posés sur le worker
        run: |
          # Tout passe par `tee` : le résumé du run n'est lisible que dans
          # l'interface web, alors qu'un journal se récupère en ligne de
          # commande (`gh run view --log`). Sans danger, on n'écrit que des
          # comptes et des noms de secrets — cf. la note de confidentialité
          # en tête de fichier, qui reste valable.
          exec > >(tee -a "$GITHUB_STEP_SUMMARY")
          echo "### Secrets du worker"
          echo '`wrangler secret list` ne montre que les NOMS, jamais les valeurs.'
          echo ''
          npx wrangler secret list > secrets.json
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if grep -q "\"$name\"" secrets.json; then
              echo "- ✅ \`$name\` présent"
            else
              echo "- ❌ \`$name\` **MANQUANT** — le push échoue en silence"
            fi
          done

      - name: Compter les profils et les abonnés push
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY")
          npx wrangler kv key list --binding=NOTIF_PROFILES --remote --prefix=profile: > profils.json
          # Un seul `kv key get` par clé, dont on ne garde QUE le booléen
          # « a un abonnement » — le contenu ne sort jamais du runner.
          profils=0
          abonnes=0
          for cle in $(node -e "for (const k of require('./profils.json')) console.log(k.name)"); do
            profils=$((profils + 1))
            valeur=$(npx wrangler kv key get --binding=NOTIF_PROFILES --remote "$cle")
            if node -e "process.exit(JSON.parse(process.argv[1]).subscription ? 0 : 1)" "$valeur"; then
              abonnes=$((abonnes + 1))
            fi
          done
          {
            echo ''
            echo "### Abonnements"
            echo "- profils enregistrés (Réglages synchronisés) : **$profils**"
            echo "- dont abonnés aux notifications push : **$abonnes**"
          }

      - name: Envois du dernier cycle et cumul
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY")
          # `kv key get` sur une clé absente ne renvoie PAS un code d'erreur :
          # il imprime un message coloré sur la sortie standard. Un simple
          # test de chaîne vide le laisse passer et JSON.parse s'étrangle
          # dessus. On ne garde donc la valeur que si elle parse.
          lire_json() {
            local val
            val=$(npx wrangler kv key get --binding=NOTIF_PROFILES --remote "$1" 2>/dev/null) || return 0
            node -e 'JSON.parse(process.argv[1])' "$val" 2>/dev/null || return 0
            printf '%s' "$val"
          }
          dernier=$(lire_json push-stats:last)
          cumul=$(lire_json push-stats:totals)
          echo ""
          echo "### Envois push"
          # Mise en forme en JS via un heredoc plutôt qu'un `node -e '...'` :
          # les messages contiennent des apostrophes françaises, qui
          # refermeraient la chaîne du shell.
          if [ -z "$dernier" ]; then
            echo "Aucun envoi tenté depuis la mise en place des compteurs — normal tant que le planning ne bouge pas dans les listes d'un abonné."
          else
            node - "$dernier" <<'JS'
          const d = JSON.parse(process.argv[2])
          console.log(`Dernier cycle avec envoi — **${d.at}** (${d.changes} entrée(s) de changes.json) :`)
          console.log(`- tentés : **${d.attempted}**`)
          console.log(`- acceptés par le service push : **${d.sent}**`)
          console.log(`- abonnements périmés (effacés du KV) : **${d.expired}**`)
          console.log(`- en échec : **${d.failed}**`)
          const codes = Object.entries(d.statuses || {})
          if (codes.length)
            console.log(`- détail : ${codes.map(([k, n]) => `\`${k}\` ×${n}`).join(", ")}`)
          // La raison donnée par le service push (Apple, Google…) pour chaque
          // code, enregistrée par le worker depuis #165 : sans elle, `400 ×27`
          // ne dit pas quoi corriger. Journaux publics : on masque par
          // précaution toute longue chaîne opaque (jeton, identifiant).
          const net = (r) => String(r).replace(/\s+/g, " ").replace(/`/g, "'").replace(/[A-Za-z0-9_+\/=-]{40,}/g, "[…]")
          const reasons = Object.entries(d.reasons || {})
          if (reasons.length)
            console.log(`- raisons : ${reasons.map(([k, r]) => `\`${k}\` → \`${net(r)}\``).join(" · ")}`)
          if (d.sent === 0 && d.attempted > 0) {
            console.log("")
            console.log("> ⚠️ Aucun envoi accepté sur ce cycle : les abonnés ne reçoivent rien.")
          }
          JS
          fi
          if [ -n "$cumul" ]; then
            node - "$cumul" <<'JS'
          const t = JSON.parse(process.argv[2])
          console.log("")
          console.log(`Cumul depuis le ${t.since} : **${t.sent}** acceptés, **${t.failed}** en échec, **${t.expired}** périmés (sur ${t.attempted} tentés).`)
          if (t.sent === 0 && t.attempted > 0) {
            console.log("> ⚠️ Aucun push accepté depuis le début : la chaîne est cassée, pas seulement en panne passagère.")
          }
          JS
          fi

      - name: Emails des retours du formulaire
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY")
          # Même lecture prudente qu'à l'étape précédente (clé absente ≠ JSON).
          lire_json() {
            local val
            val=$(npx wrangler kv key get --binding=NOTIF_PROFILES --remote "$1" 2>/dev/null) || return 0
            node -e 'JSON.parse(process.argv[1])' "$val" 2>/dev/null || return 0
            printf '%s' "$val"
          }
          echo ""
          echo "### Emails des retours du formulaire"
          # secrets.json : liste des NOMS de secrets, écrite par la première étape.
          for name in RESEND_API_KEY FEEDBACK_TO; do
            if grep -q "\"$name\"" secrets.json; then
              echo "- ✅ \`$name\` présent"
            else
              echo "- ❌ \`$name\` **MANQUANT** — les retours restent dans le KV sans partir par email"
            fi
          done
          cumul=$(lire_json feedback-mail:totals)
          if [ -z "$cumul" ]; then
            echo ""
            echo "Aucun retour reçu depuis la mise en place de l'envoi par email."
          else
            node - "$cumul" "$(lire_json feedback-mail:last)" <<'JS'
          const t = JSON.parse(process.argv[2])
          const d = process.argv[3] ? JSON.parse(process.argv[3]) : null
          // Journaux publics : une adresse citée dans une erreur de Resend
          // (« you can only send to … ») est masquée.
          const net = (r) => String(r).replace(/\s+/g, " ").replace(/`/g, "'").replace(/[^\s@<>"']+@[^\s@<>"']+/g, "[adresse]")
          console.log("")
          console.log(`Depuis le ${t.since} : **${t.sent || 0}** envoyés, **${t.failed || 0}** en échec, **${t.skipped || 0}** non envoyés (configuration absente).`)
          if (d) {
            const detail = [d.status && `HTTP ${d.status}`, d.error, d.reason && `\`${net(d.reason)}\``].filter(Boolean).join(" — ")
            console.log(`- dernier retour : ${d.at} → **${d.kind}**${detail ? ` (${detail})` : ""}`)
            if (d.kind !== "sent") {
              console.log("")
              console.log("> ⚠️ Le dernier retour n'est pas parti par email.")
            }
          }
          JS
          fi

      - name: Lancements des crons de données
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY")
          # Même lecture prudente qu'aux étapes précédentes (clé absente ≠ JSON).
          lire_json() {
            local val
            val=$(npx wrangler kv key get --binding=NOTIF_PROFILES --remote "$1" 2>/dev/null) || return 0
            node -e 'JSON.parse(process.argv[1])' "$val" 2>/dev/null || return 0
            printf '%s' "$val"
          }
          echo ""
          echo "### Lancement des crons de données par le worker"
          # secrets.json : liste des NOMS de secrets, écrite par la première étape.
          if grep -q '"GH_DISPATCH_TOKEN"' secrets.json; then
            echo "- ✅ \`GH_DISPATCH_TOKEN\` présent"
          else
            echo "- ❌ \`GH_DISPATCH_TOKEN\` **MANQUANT** — seuls les \`schedule\` de GitHub (non tenus) lancent les mises à jour"
          fi
          cumul=$(lire_json dispatch-stats:totals)
          if [ -z "$cumul" ]; then
            echo ""
            echo "Aucun lancement enregistré pour l'instant."
          else
            node - "$cumul" "$(lire_json dispatch-stats:last)" <<'JS'
          const t = JSON.parse(process.argv[2])
          const d = process.argv[3] ? JSON.parse(process.argv[3]) : null
          // Journaux publics : on masque par précaution toute longue chaîne
          // opaque (jeton, identifiant) d'un message d'erreur de GitHub.
          const net = (r) => String(r).replace(/\s+/g, " ").replace(/`/g, "'").replace(/[A-Za-z0-9_+\/=-]{40,}/g, "[…]")
          console.log("")
          console.log(`Depuis le ${t.since} : **${t.sent || 0}** lancements acceptés par GitHub, **${t.failed || 0}** en échec (12 planning + 1 mémo attendus par jour).`)
          if (d) {
            const detail = (o) => [o.status && `HTTP ${o.status}`, o.error, o.reason && `\`${net(o.reason)}\``].filter(Boolean).join(" — ")
            for (const o of d.outcomes || [])
              console.log(`- dernier réveil (${d.at}) : \`${o.workflow}\` → **${o.kind}**${detail(o) ? ` (${detail(o)})` : ""}`)
            if ((d.outcomes || []).some((o) => o.kind !== "sent")) {
              console.log("")
              console.log("> ⚠️ Le dernier lancement a échoué : jeton expiré ou révoqué ? Planning et mémo ne se mettent plus à jour qu'au rythme (irrégulier) des `schedule` de GitHub.")
            }
          }
          JS
          fi

      - name: Curseur du cron
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY")
          # Même précaution que pour les compteurs : une clé absente ressort
          # sous forme de message d'erreur, pas d'un code de retour.
          curseur=$(npx wrangler kv key get --binding=NOTIF_PROFILES --remote cursor 2>/dev/null) || curseur=""
          case "$curseur" in 20*) ;; *) curseur="(absent)" ;; esac
          {
            echo ''
            echo "### Curseur du cron"
            echo "Dernière entrée de \`changes.json\` traitée : \`$curseur\`"
            echo "S'il est absent, aucun cycle n'a encore tourné : le prochain le posera sans rien envoyer."
          }

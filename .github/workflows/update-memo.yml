name: Mise à jour du mémo de production

# Une fois par nuit : régénère le « Mémo de Production » depuis le mini-site
# Dièse (génération PDF côté serveur — on reste courtois avec une fréquence
# quotidienne), le convertit en productions.json et publie le résultat
# DIRECTEMENT sur gh-pages, sans jamais pousser sur main (même logique que
# update-data.yml : main ne contient que du code + un instantané des données).
#
# Le script journalise aussi les évolutions du mémo dans data/changes.json,
# d'où la publication des deux fichiers. Les étapes elles-mêmes sont dans
# scripts/cron.mjs (cf. son en-tête).

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Pour signaler un échec du cron dans une issue (voir dernière étape)
  issues: write

concurrency:
  # `queue: max` : voir le commentaire dans deploy.yml.
  group: gh-pages
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    # Un run normal dure ~1 min. Les appels au mini-site Dièse (génération du
    # PDF côté serveur puis téléchargement, cf. scripts/update-memo.mjs) sont
    # des `fetch` sans timeout : si Dièse ne répond ni ne coupe, le job
    # pendrait jusqu'au plafond GitHub de 6 h, en silence. On borne donc à
    # 10 min pour échouer vite et déclencher l'alerte ci-dessous plutôt que de
    # rester invisible (même rustine que update-data.yml, cf. #108).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # Toute la logique (récupérer l'état servi sur gh-pages, régénérer,
      # détecter un changement, préparer out/) est dans scripts/cron.mjs : elle
      # se corrige par une PR ordinaire, sans toucher à ce fichier.
      - name: Régénérer productions.json
        id: run
        run: node scripts/cron.mjs run memo

      - name: Publier le mémo (gh-pages)
        if: steps.run.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          keep_files: true
          commit_message: "data: mise à jour du mémo de production"

      # Panne silencieuse : personne ne surveille l'onglet Actions. Si le run
      # échoue (mini-site Dièse modifié, parsing cassé…), on ouvre une issue —
      # donc une notification (cf. scripts/cron.mjs).
      #
      # failure() seul rate un run interrompu APRÈS son démarrage (dépassement
      # du timeout-minutes ci-dessus, annulation manuelle) : sa conclusion est
      # alors `cancelled`, et l'étape serait sautée. On alerte donc sur tout
      # run qui n'est pas un succès.
      - name: Signaler l'échec dans une issue
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cron.mjs alert memo

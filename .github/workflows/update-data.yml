name: Mise à jour des données ICS

# Toutes les 2 heures : télécharge l'export ICS (URL secrète, elle contient un
# jeton d'accès), régénère data/planning.json + data/changes.json et publie le
# résultat DIRECTEMENT sur gh-pages (dossier data/), sans jamais pousser sur
# main. Ainsi main ne contient que du code (protégeable par la CI requise) et
# les données vivantes n'existent que sur gh-pages ; main garde un simple
# instantané de data/ pour le dev local et le smoke test.
#
# Les étapes elles-mêmes sont dans scripts/cron.mjs (cf. son en-tête).

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Pour signaler un échec du cron dans une issue (voir dernière étape)
  issues: write

concurrency:
  # Même groupe que deploy.yml / preview.yml / update-memo.yml : sérialise
  # toutes les écritures sur gh-pages (et évite les races entre crons).
  # `queue: max` : voir le commentaire dans deploy.yml.
  group: gh-pages
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    # Un run normal dure 10 à 30 s. Le téléchargement de l'ICS est un `fetch`
    # sans timeout (scripts/update-data.mjs) : si Dièse ne répond ni ne coupe,
    # le job pendrait jusqu'au plafond GitHub de 6 h, en silence. On borne donc
    # à 5 min (10× la marge) pour échouer vite et déclencher l'alerte
    # ci-dessous plutôt que de rester invisible.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Toute la logique (récupérer l'état servi sur gh-pages, régénérer,
      # détecter un changement, préparer out/) est dans scripts/cron.mjs : elle
      # se corrige par une PR ordinaire, sans toucher à ce fichier.
      - name: Régénérer le planning
        id: run
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: node scripts/cron.mjs run planning

      - name: Publier les données (gh-pages)
        if: steps.run.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          keep_files: true
          commit_message: "data: mise à jour du planning ICS"

      # Panne silencieuse : personne ne surveille l'onglet Actions. Si le run
      # échoue (jeton ICS invalide, changement côté Dièse, incident GitHub…),
      # on ouvre une issue — donc une notification (cf. scripts/cron.mjs).
      #
      # failure() seul rate un run interrompu APRÈS son démarrage (dépassement
      # du timeout-minutes ci-dessus, annulation manuelle) : sa conclusion est
      # alors `cancelled`, et l'étape serait sautée. On alerte donc sur tout
      # run qui n'est pas un succès.
      - name: Signaler l'échec dans une issue
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cron.mjs alert planning

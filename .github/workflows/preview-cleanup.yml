name: Cleanup branch preview

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

# Même groupe que deploy.yml / preview.yml / update-data.yml / update-memo.yml :
# TOUTES les écritures sur gh-pages sont sérialisées.
#
# Ce cleanup a longtemps eu son propre groupe, pour qu'une fermeture de PR ne
# supplante pas un déploiement en attente. Mais c'est précisément la
# coïncidence « merge d'une PR = push sur main (deploy) + PR fermée (cleanup) »
# qui posait problème : sur les 60 derniers runs de deploy.yml, les 4 échecs
# (`! [remote rejected] gh-pages … cannot lock ref`) tombent tous à la seconde
# près sur un run de ce workflow. Un déploiement perdu ne republie pas
# index.html / app.js / style.css jusqu'au prochain push sur main, alors qu'une
# preview périmée qui traîne un moment est bénigne : on sérialise.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Compute preview slug
        id: slug
        run: |
          raw='${{ github.head_ref }}'
          slug=$(echo "$raw" | tr -c 'a-zA-Z0-9-' '-' | tr -s '-' | sed 's/^-\|-$//g')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove preview directory
        run: |
          dir="previews/${{ steps.slug.outputs.slug }}"
          if [ -d "$dir" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git rm -rf "$dir"
            git commit -m "cleanup: remove preview ${{ steps.slug.outputs.slug }}"
            # Filet de secours : la concurrence ci-dessus sérialise déjà les
            # écritures gh-pages, mais rien n'interdit une écriture venue
            # d'ailleurs (push manuel). On retente avec rebase le cas échéant.
            for i in 1 2 3 4 5; do
              if git push origin gh-pages; then
                exit 0
              fi
              echo "Push refusé (tentative $i), rebase sur gh-pages distant…"
              git fetch origin gh-pages
              git rebase origin/gh-pages || exit 1
            done
            echo "::error::Impossible de pousser le cleanup après 5 tentatives"
            exit 1
          else
            echo "No preview directory at $dir, nothing to clean."
          fi

      - name: Update PR comment
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: marocchino/sticky-pull-request-comment@v2
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            header: preview-${{ steps.slug.outputs.slug }}
            message: |
              _Preview supprimée_ (PR fermée). L'URL n'est plus accessible.

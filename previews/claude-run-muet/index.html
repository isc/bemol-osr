<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Bémol · Planning OSR</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎼</text></svg>"
    />

    <!-- Application installable (« Ajouter à l'écran d'accueil ») : manifeste,
         couleur de barre d'état et icônes iOS. Tout en chemins relatifs. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1d1912" />
    <!-- Applique le mode sombre avant le premier rendu (évite un flash blanc)
         si l'utilisateur l'a choisi, ou si "auto" (par défaut) et que le
         système est en sombre. Logique complète (bascule, écoute des
         changements système) dans app.js. L'en-tête « programme de concert »
         (theme-color ci-dessus) ne change pas avec le thème. -->
    <script>
      ;(function () {
        try {
          var prefs = JSON.parse(localStorage.getItem("bemol-prefs") || "{}")
          var theme = prefs.theme || "auto"
          var dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) {
            document.documentElement.dataset.theme = "dark"
          }
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bémol" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="style.css?v=747b283ed17f" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1>♭ Bémol <span class="subtitle">Planning OSR</span></h1>
        <div class="header-controls">
          <button id="search-btn" class="icon-btn" aria-label="Rechercher">
            <svg data-icon="search"></svg>
          </button>
          <button
            id="feedback-btn"
            class="icon-btn"
            aria-label="Donner un avis"
            hidden
          >
            <svg data-icon="message"></svg>
          </button>
        </div>
      </div>
      <!-- Recherche derrière la loupe : le champ s'ouvre à la place du titre,
           déjà sélectionné (setSearch dans app.js). -->
      <form id="search-row" class="search-row">
        <svg data-icon="search"></svg>
        <input
          id="search-input"
          type="search"
          enterkeyhint="search"
          placeholder="Œuvre, compositeur, chef, soliste, lieu…"
        />
        <button id="search-cancel" type="button">Annuler</button>
      </form>
    </header>

    <main id="main">
      <p id="loading">Chargement du planning…</p>
    </main>

    <footer>
      <span id="update-info"></span>
      <span
        >Source : export ICS Dièse ·
        <a href="https://github.com/isc/bemol-osr">GitHub</a></span
      >
    </footer>

    <dialog id="detail-dialog" tabindex="-1" class="sheet">
      <div id="detail-content" class="detail-box"></div>
      <form method="dialog"><button class="close-btn">Fermer</button></form>
    </dialog>

    <dialog id="today-dialog" tabindex="-1">
      <div id="today-content" class="detail-box"></div>
      <form method="dialog"><button class="close-btn">Fermer</button></form>
    </dialog>

    <dialog id="liste-dialog" tabindex="-1">
      <div id="liste-content" class="detail-box"></div>
      <form method="dialog"><button class="close-btn">Fermer</button></form>
    </dialog>

    <dialog id="subscribe-dialog" tabindex="-1">
      <div class="dialog-head">
        <h2>S'abonner au calendrier</h2>
        <form method="dialog">
          <button class="close-btn-top" aria-label="Fermer">
            <svg data-icon="x"></svg>
          </button>
        </form>
      </div>
      <div id="subscribe-content"></div>
      <form method="dialog"><button class="close-btn">Fermer</button></form>
    </dialog>

    <dialog id="install-dialog" tabindex="-1">
      <div class="dialog-head">
        <h2>Installer l'application</h2>
        <form method="dialog">
          <button class="close-btn-top" aria-label="Fermer">
            <svg data-icon="x"></svg>
          </button>
        </form>
      </div>
      <div id="install-content"></div>
      <form method="dialog"><button class="close-btn">Fermer</button></form>
    </dialog>

    <!-- Menu « ⋯ » du bandeau : les actions rares, en feuille qui monte du
         bas de l'écran (openMenu dans app.js). -->
    <dialog id="menu-dialog" tabindex="-1" class="sheet">
      <div id="menu-content"></div>
    </dialog>

    <dialog id="feedback-dialog" tabindex="-1">
      <div class="dialog-head">
        <h2>Donner un avis</h2>
        <form method="dialog">
          <button class="close-btn-top" aria-label="Fermer">
            <svg data-icon="x"></svg>
          </button>
        </form>
      </div>
      <div id="feedback-content"></div>
      <form method="dialog"><button class="close-btn">Fermer</button></form>
    </dialog>

    <!-- Onglets en bas d'écran, à portée de pouce (cf. setView dans app.js).
         Réglages est une page comme les autres (renderReglages). -->
    <nav id="view-nav">
      <button data-view="grille">
        <svg data-icon="calendar"></svg><span>Mon agenda</span>
      </button>
      <button data-view="document">
        <svg data-icon="book"></svg><span>Bible</span>
      </button>
      <button data-view="modifs">
        <svg data-icon="history"></svg><span>Modifs</span
        ><span id="modifs-badge" class="badge" hidden></span>
      </button>
      <button data-view="reglages">
        <svg data-icon="sliders"></svg><span>Réglages</span>
      </button>
    </nav>

    <!-- Le suffixe ?v=747b283ed17f
         une mise à jour (sinon la version en cache masque les nouveautés).
         « dev » est un simple placeholder : les workflows de publication le
         remplacent automatiquement par le SHA du commit — ne jamais le
         modifier à la main. -->
    <script src="app.js?v=747b283ed17f"></script>
  </body>
</html>

# Bémol · worker d'abonnement personnalisé + notifications push — config
# Cloudflare Workers. Déployé automatiquement par
# .github/workflows/deploy-worker.yml.
name = "bemol-calendrier"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

# Cron toutes les 15 min, pour deux tâches (cf. scheduled() dans src/index.js) :
# - détection des changements et notifications (cf. worker/src/notify.js) —
#   le curseur KV rattrape de toute façon tout ce qui a été manqué ;
# - lancement à l'heure des crons de données de GitHub (update-data.yml toutes
#   les 2 h, update-memo.yml la nuit), dont les `schedule` ne sont pas tenus.
#   Secret GH_DISPATCH_TOKEN, recopié depuis le dépôt par deploy-worker.yml.
[triggers]
crons = ["*/15 * * * *"]

# KV des profils (jeton d'appareil → { prefs, subscription }), qui sert à la
# fois à l'abonnement ICS « qui suit les Réglages » et aux notifications push.
#
# Mise en place faite une seule fois (à refaire seulement si le namespace ou
# les secrets sont recréés) :
#   1. wrangler kv namespace create NOTIF_PROFILES → id ci-dessous.
#   2. npx web-push generate-vapid-keys
#   3. Depuis worker/, avec wrangler authentifié (wrangler login) :
#      wrangler secret put VAPID_PUBLIC_KEY
#      wrangler secret put VAPID_PRIVATE_KEY
#      wrangler secret put VAPID_SUBJECT   (ex. "mailto:toi@example.org")
#   4. Redéployer (push sur main, ou workflow_dispatch de deploy-worker.yml).
[[kv_namespaces]]
binding = "NOTIF_PROFILES"
id = "550bbe6e7a3649c6b57d2fa46453e8e4"

# Retours du formulaire « Donner un avis » envoyés par email (cf.
# handleFeedback) : expéditeur sur le domaine d'Arabesque, déjà vérifié chez
# Resend. Les destinataires (FEEDBACK_TO) et la clé d'API (RESEND_API_KEY)
# sont des SECRETS du dépôt GitHub, le dépôt étant public : deploy-worker.yml
# les recopie sur le worker à chaque déploiement.
[vars]
FEEDBACK_FROM = "Bémol <bemol@arabesque.app>"
